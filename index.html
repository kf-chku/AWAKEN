<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AWAKEN</title>

<style>

* {
    box-sizing: border-box;
    -webkit-user-select: none !important;
    user-select: none !important;
    -webkit-touch-callout: none !important;
    -webkit-tap-highlight-color: transparent !important;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #050505;
    color: #eee;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

.game {
    width: min(900px, 100%);
    min-height: 100vh;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-y: auto;
}

h1 {
    margin: 10px 0 2px;
    font-size: 42px;
    letter-spacing: 12px;
    font-weight: 300;
}

.subtitle {
    color: #666;
    font-size: 13px;
    letter-spacing: 3px;
    font-style: italic;
}

.resources {
    margin-top: 30px;
    text-align: center;
}

.energy-number,
.void-number {
    font-size: 38px;
    font-weight: bold;
}

.energy-label,
.void-label {
    color: #666;
    letter-spacing: 4px;
    font-size: 10px;
}

.void-resource {
    display: none;
    margin-top: 15px;
}

.void-resource.active {
    display: block;
}

.void-number {
    color: #aaa;
    text-shadow: 0 0 15px #fff;
}

.entity {
    margin-top: 35px;
    width: 190px;
    height: 190px;
    border-radius: 50%;

    background: radial-gradient(
        circle,
        #444 0%,
        #171717 35%,
        #080808 70%
    );

    box-shadow: 0 0 30px rgba(255,255,255,.08);

    display: flex;
    justify-content: center;
    align-items: center;

    cursor: pointer;

    transition:
        transform .08s,
        box-shadow .4s,
        background .8s;
}

.entity:active {
    transform: scale(.94);
}

.core {
    width: 35px;
    height: 35px;
    border-radius: 50%;

    background: #aaa;

    box-shadow: 0 0 25px #aaa;

    transition:
        width .8s,
        height .8s,
        box-shadow .8s,
        background .8s;

    position: relative;
}

.eye {
    display: none;

    position: absolute;
    width: 70%;
    height: 38%;
    left: 15%;
    top: 31%;

    border-radius: 50%;
    background: #050505;

    box-shadow: 0 0 12px #fff;
}

.eye::after {
    content: "";

    position: absolute;

    width: 7px;
    height: 7px;

    background: #fff;
    border-radius: 50%;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    box-shadow: 0 0 12px #fff;
}

.hint {
    margin-top: 18px;
    color: #555;
    font-size: 12px;
}

.upgrades {
    margin-top: 30px;
    width: min(500px, 100%);
}

.upgrade {
    width: 100%;
    padding: 14px;
    margin-top: 10px;

    background: #0d0d0d;
    border: 1px solid #222;

    color: #ddd;

    cursor: pointer;
    text-align: left;

    border-radius: 8px;

    transition:
        border-color .2s,
        background .2s;
}

.upgrade:hover {
    border-color: #555;
}

.upgrade:disabled {
    opacity: .35;
    cursor: not-allowed;
}

.upgrade.locked {
    opacity: .25;
}

.upgrade-name {
    font-weight: bold;
}

.upgrade-info {
    margin-top: 4px;
    color: #777;
    font-size: 12px;
}

/* VOID */

.void-panel {
    display: none;

    width: min(500px, 100%);
    margin-top: 25px;

    padding: 18px;

    border: 1px solid #222;
    background: #090909;

    border-radius: 8px;

    text-align: center;
}

.void-panel.active {
    display: block;
}

.void-title {
    letter-spacing: 5px;
    font-size: 14px;
    color: #aaa;
}

.void-description {
    margin-top: 8px;
    color: #555;
    font-size: 11px;
}

.void-button {
    margin-top: 15px;

    width: 100%;
    padding: 13px;

    background: #111;
    border: 1px solid #333;

    color: #ddd;

    border-radius: 8px;
}

.void-button:not(:disabled) {
    cursor: pointer;
}

.void-button:disabled {
    opacity: .3;
}

/* MESSAGE */

.message {
    position: fixed;
    bottom: 25px;

    color: #555;

    font-size: 12px;
    letter-spacing: 1px;

    text-align: center;

    max-width: 90%;
}

/* EVOLUTION */

.stage1 .core {
    width: 35px;
    height: 35px;
}

.stage2 .core {
    width: 48px;
    height: 48px;
    background: #bbb;
    box-shadow: 0 0 45px #aaa;
}

.stage3 .core {
    width: 62px;
    height: 62px;
    background: #ddd;

    box-shadow:
        0 0 30px #fff,
        0 0 70px #aaa;
}

.stage4 {
    box-shadow:
        0 0 40px rgba(255,255,255,.15),
        0 0 100px rgba(255,255,255,.08);
}

.stage4 .core {
    width: 78px;
    height: 78px;
    background: #fff;

    box-shadow:
        0 0 35px #fff,
        0 0 90px #fff,
        0 0 140px rgba(255,255,255,.5);
}

.stage5 {
    animation: pulse 2s infinite;
}

.stage5 .core {
    width: 95px;
    height: 95px;
    background: #fff;

    box-shadow:
        0 0 45px #fff,
        0 0 100px #fff,
        0 0 180px #fff;
}

.stage6 {
    animation: awakenPulse 1.5s infinite;

    box-shadow:
        0 0 60px rgba(255,255,255,.2),
        0 0 150px rgba(255,255,255,.15);
}

.stage6 .core {
    width: 110px;
    height: 110px;

    background: #ddd;

    box-shadow:
        0 0 50px #fff,
        0 0 110px #fff,
        0 0 200px #fff;
}

.stage6 .eye {
    display: block;
}

.stage7 {
    animation: finalPulse 1s infinite;

    box-shadow:
        0 0 80px rgba(255,255,255,.25),
        0 0 200px rgba(255,255,255,.2);
}

.stage7 .core {
    width: 125px;
    height: 125px;

    background: #fff;

    box-shadow:
        0 0 60px #fff,
        0 0 140px #fff,
        0 0 250px #fff;
}

.stage7 .eye {
    display: block;
}

.stage8 {
    animation: tutorialComplete 2s infinite;

    box-shadow:
        0 0 100px rgba(255,255,255,.3),
        0 0 250px rgba(255,255,255,.25);
}

.stage8 .core {
    width: 135px;
    height: 135px;

    background: #fff;

    box-shadow:
        0 0 70px #fff,
        0 0 160px #fff,
        0 0 300px #fff;
}

.stage8 .eye {
    display: block;
}

@keyframes pulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.03);
    }
}

@keyframes awakenPulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.05);
    }
}

@keyframes finalPulse {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.07);
    }
}

@keyframes tutorialComplete {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.1);
    }
}

@keyframes eyeOpen {
    0% {
        transform: scaleY(0);
        opacity: 0;
    }

    100% {
        transform: scaleY(1);
        opacity: 1;
    }
}

</style>
</head>

<body>

<div class="game">

    <h1>AWAKEN</h1>

    <div class="subtitle">
        Something Is Waiting
    </div>

    <div class="resources">

        <div class="energy-number" id="energy">
            0
        </div>

        <div class="energy-label">
            ENERGY
        </div>

        <div
            class="void-resource"
            id="voidResource"
        >

            <div
                class="void-number"
                id="void"
            >
                0
            </div>

            <div class="void-label">
                VOID
            </div>

        </div>

    </div>

    <div
        class="entity stage1"
        id="entity"
    >

        <div class="core">

            <div class="eye"></div>

        </div>

    </div>

    <div class="hint">
        Feed it.
    </div>

    <!-- ENERGY UPGRADES -->

    <div class="upgrades">

        <button
            class="upgrade"
            id="upgrade1"
            onclick="buyUpgrade(1)"
            disabled
        >

            <div class="upgrade-name">
                Stronger Pulse
            </div>

            <div class="upgrade-info">
                Cost:
                <span id="cost1">25</span>
                Energy · +1 energy per click
            </div>

        </button>


        <button
            class="upgrade"
            id="upgrade2"
            onclick="buyUpgrade(2)"
            disabled
        >

            <div class="upgrade-name">
                Passive Growth
            </div>

            <div class="upgrade-info">
                Cost:
                <span id="cost2">100</span>
                Energy · +1 energy/sec
            </div>

        </button>


        <button
            class="upgrade locked"
            id="upgrade3"
            onclick="buyUpgrade(3)"
            disabled
        >

            <div class="upgrade-name">
                Deep Pulse
            </div>

            <div class="upgrade-info">
                Unlocks at 500 Energy ·
                Cost:
                <span id="cost3">500</span>
                · +5 energy/click
            </div>

        </button>


        <button
            class="upgrade locked"
            id="upgrade4"
            onclick="buyUpgrade(4)"
            disabled
        >

            <div class="upgrade-name">
                Dark Flow
            </div>

            <div class="upgrade-info">
                Unlocks at 1,000 Energy ·
                Cost:
                <span id="cost4">1500</span>
                · +5 energy/sec
            </div>

        </button>


        <button
            class="upgrade locked"
            id="upgrade5"
            onclick="buyUpgrade(5)"
            disabled
        >

            <div class="upgrade-name">
                Feeding Frenzy
            </div>

            <div class="upgrade-info">
                Unlocks at 5,000 Energy ·
                Cost:
                <span id="cost5">5000</span>
                · +25 energy/click
            </div>

        </button>


        <button
            class="upgrade locked"
            id="upgrade6"
            onclick="buyUpgrade(6)"
            disabled
        >

            <div class="upgrade-name">
                Awakened Core
            </div>

            <div class="upgrade-info">
                Unlocks at 10,000 Energy ·
                Cost:
                <span id="cost6">15000</span>
                · +25 energy/sec
            </div>

        </button>

    </div>


    <!-- VOID -->

    <div
        class="void-panel"
        id="voidPanel"
    >

        <div class="void-title">
            VOID
        </div>

        <div class="void-description">
            Something else is waiting.
        </div>

        <button
            class="void-button"
            id="voidButton"
            onclick="createVoid()"
            disabled
        >
            Sacrifice 10,000 Energy
        </button>

    </div>

</div>


<div
    class="message"
    id="message"
>
    It is still sleeping.
</div>


<script>

/* =========================
   GAME DATA
========================= */

let energy = 0;

let voidPower = 0;

let clickPower = 1;

let autoPower = 0;


/* =========================
   VOID
========================= */

let voidUnlocked = false;

const VOID_COST = 10000;


/* =========================
   UPGRADES
========================= */

const upgrades = {

    1: {
        cost: 25,
        unlock: 0,
        click: 1,
        auto: 0,
        multiplier: 1.12
    },

    2: {
        cost: 100,
        unlock: 0,
        click: 0,
        auto: 1,
        multiplier: 1.14
    },

    3: {
        cost: 500,
        unlock: 500,
        click: 5,
        auto: 0,
        multiplier: 1.16
    },

    4: {
        cost: 1500,
        unlock: 1000,
        click: 0,
        auto: 5,
        multiplier: 1.18
    },

    5: {
        cost: 5000,
        unlock: 5000,
        click: 25,
        auto: 0,
        multiplier: 1.20
    },

    6: {
        cost: 15000,
        unlock: 10000,
        click: 0,
        auto: 25,
        multiplier: 1.22
    }

};


/* =========================
   ELEMENTS
========================= */

const energyEl =
    document.getElementById("energy");

const voidEl =
    document.getElementById("void");

const entity =
    document.getElementById("entity");

const message =
    document.getElementById("message");

const voidResource =
    document.getElementById("voidResource");

const voidPanel =
    document.getElementById("voidPanel");

const voidButton =
    document.getElementById("voidButton");


/* =========================
   UPDATE
========================= */

function update() {

    energyEl.textContent =
        Math.floor(energy);

    voidEl.textContent =
        Math.floor(voidPower);

    updateUpgrades();

    updateEvolution();

    updateVoid();

}


/* =========================
   UPGRADES
========================= */

function updateUpgrades() {

    for (
        let i = 1;
        i <= 6;
        i++
    ) {

        const upgrade =
            upgrades[i];

        const button =
            document.getElementById(
                "upgrade" + i
            );

        const unlocked =
            energy >= upgrade.unlock;

        if (unlocked) {

            button.classList.remove(
                "locked"
            );

            button.disabled =
                energy < upgrade.cost;

        } else {

            button.classList.add(
                "locked"
            );

            button.disabled = true;

        }

    }

}


function buyUpgrade(id) {

    const upgrade =
        upgrades[id];

    if (
        energy < upgrade.cost ||
        energy < upgrade.unlock
    ) {
        return;
    }

    energy -= upgrade.cost;

    clickPower +=
        upgrade.click;

    autoPower +=
        upgrade.auto;

    upgrade.cost =
        Math.floor(
            upgrade.cost *
            upgrade.multiplier
        );

    document.getElementById(
        "cost" + id
    ).textContent =
        upgrade.cost;

    update();

    save();

}


/* =========================
   EVOLUTION
========================= */

function updateEvolution() {

    entity.classList.remove(

        "stage1",
        "stage2",
        "stage3",
        "stage4",
        "stage5",
        "stage6",
        "stage7",
        "stage8"

    );


    if (energy < 100) {

        entity.classList.add("stage1");

        message.textContent =
            "It is still sleeping.";

    }

    else if (energy < 500) {

        entity.classList.add("stage2");

        message.textContent =
            "Something is stirring.";

    }

    else if (energy < 1000) {

        entity.classList.add("stage3");

        message.textContent =
            "It knows you are here.";

    }

    else if (energy < 5000) {

        entity.classList.add("stage4");

        message.textContent =
            "It is beginning to awaken.";

    }

    else if (energy < 10000) {

        entity.classList.add("stage5");

        message.textContent =
            "It is awake.";

    }

    else if (energy < 50000) {

        entity.classList.add("stage6");

        message.textContent =
            "It is looking at you.";

    }

    else if (energy < 100000) {

        entity.classList.add("stage7");

        message.textContent =
            "Something is trying to get out.";

    }

    else {

        entity.classList.add("stage8");

        if (!voidUnlocked) {

            message.textContent =
                "It doesn't need your help anymore.";

        } else {

            message.textContent =
                "Something else is waiting.";

        }

    }

}


/* =========================
   VOID
========================= */

function updateVoid() {

    if (energy >= 100000) {

        if (!voidUnlocked) {

            voidUnlocked = true;

        }

    }

    if (voidUnlocked) {

        voidResource.classList.add(
            "active"
        );

        voidPanel.classList.add(
            "active"
        );

        voidButton.disabled =
            energy < VOID_COST;

    }

}


function createVoid() {

    if (energy < VOID_COST) {
        return;
    }

    energy -= VOID_COST;

    voidPower += 1;

    message.textContent =
        "Something else is waiting.";

    update();

    save();

}


/* =========================
   ENTITY CLICK
========================= */

entity.addEventListener(
    "click",
    () => {

        energy += clickPower;

        update();

        save();

    }
);


/* =========================
   PASSIVE ENERGY
========================= */

setInterval(
    () => {

        if (autoPower > 0) {

            energy += autoPower;

            update();

            save();

        }

    },
    1000
);


/* =========================
   SAVE
========================= */

function save() {

    localStorage.setItem(

        "awakenSave",

        JSON.stringify({

            energy,

            voidPower,

            voidUnlocked,

            clickPower,

            autoPower,

            upgrades

        })

    );

}


/* =========================
   LOAD
========================= */

function load() {

    const data =
        localStorage.getItem(
            "awakenSave"
        );

    if (!data) return;

    try {

        const saveData =
            JSON.parse(data);


        energy =
            saveData.energy || 0;


        voidPower =
            saveData.voidPower || 0;


        voidUnlocked =
            saveData.voidUnlocked || false;


        clickPower =
            saveData.clickPower || 1;


        autoPower =
            saveData.autoPower || 0;


        if (saveData.upgrades) {

            for (
                let i = 1;
                i <= 6;
                i++
            ) {

                if (
                    saveData.upgrades[i]
                ) {

                    upgrades[i].cost =
                        saveData
                        .upgrades[i]
                        .cost;

                }

            }

        }

    } catch {

        console.log(
            "Save data could not be loaded."
        );

    }

}


/* =========================
   PREVENT SELECTION
========================= */

document.addEventListener(
    "selectstart",
    event =>
        event.preventDefault()
);


/* =========================
   START
========================= */

load();

update();

</script>

</body>
</html>
